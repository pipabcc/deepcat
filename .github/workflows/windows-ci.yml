name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装质量检查依赖
        run: python -m pip install "ruff>=0.5,<1"
      - name: 确定差异比较基准
        id: diff-base
        shell: pwsh
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          $base = $env:PULL_REQUEST_BASE
          if ([string]::IsNullOrWhiteSpace($base)) { $base = $env:PUSH_BASE }
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            $base = git rev-parse --verify HEAD^ 2>$null
            if ($LASTEXITCODE -ne 0) {
              # 首次公开提交没有父提交，以空树为基准检查全部发布文件。
              $base = $null | git mktree
            }
          }
          git cat-file -e "${base}^{tree}"
          if ($LASTEXITCODE -ne 0) { throw '无法确定差异比较基准' }
          "sha=$base" >> $env:GITHUB_OUTPUT
      - name: Ruff 检查本次改动的 Python 文件
        shell: pwsh
        env:
          DIFF_BASE: ${{ steps.diff-base.outputs.sha }}
        run: |
          $files = @(git diff --name-only --diff-filter=ACMR $env:DIFF_BASE HEAD -- '*.py')
          if ($LASTEXITCODE -ne 0) { throw '无法读取改动文件列表' }
          if ($files.Count -gt 0) { python -m ruff check -- $files }
      - name: Git 差异格式检查
        shell: pwsh
        env:
          DIFF_BASE: ${{ steps.diff-base.outputs.sha }}
        run: |
          git diff --check $env:DIFF_BASE HEAD

  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装开发依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 编译检查
        run: python -m compileall deepcat tests
      - name: 核心测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m "not network and not slow" --timeout=120

  full-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装开发依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 全量离线测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m "not network" --timeout=180

  pyinstaller-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装构建依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 校验 PP-OCRv6 Small 模型
        run: python scripts\verify_ppocrv6_models.py
      - name: PyInstaller 构建
        run: python -m PyInstaller packaging\deepcat_gui.spec --noconfirm --clean
      - name: 验证构建产物
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath 'dist\deepcat\deepcat.exe')) {
            throw 'PyInstaller 未生成 dist\deepcat\deepcat.exe'
          }
